<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Understanding Your Breast Biopsy</title>
<meta name="description" content="What an ultrasound-guided breast core biopsy is, what happens on the day, what you will feel, and what comes after — with an interactive 3D walkthrough.">
<script>/* Restore display prefs before first paint so a low-vision patient never sees a flash of small text */
try{var d=document.documentElement,s=localStorage.getItem('breast.size');
if(s==='large'||s==='xl')d.setAttribute('data-size',s);
if(localStorage.getItem('breast.contrast')==='high')d.setAttribute('data-contrast','high');}catch(_){}
</script>
