name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  # checkout/configure-pages/upload-artifact/deploy-pages still target Node 20; on the
  # forced Node 24 runtime upload-pages-artifact reports success while deploy-pages then
  # sees zero artifacts (run 45667936191). Pin them to Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Settle before deploy (artifact index race)
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
