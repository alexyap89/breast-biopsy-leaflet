<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="768" viewBox="0 0 1344 768" font-family="Avenir Next, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071b2c"/><stop offset="1" stop-color="#04121f"/>
    </linearGradient>
    <linearGradient id="gland" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b4a0"/><stop offset="1" stop-color="#d99a82"/>
    </linearGradient>
  </defs>
  <rect width="1344" height="768" fill="url(#bg)"/>
  <!-- chest wall / ribs (bottom) -->
  <rect x="120" y="640" width="1104" height="90" rx="24" fill="#3d5a75"/>
  <g fill="#4d6c88">
    <rect x="180" y="648" width="120" height="74" rx="20"/><rect x="360" y="648" width="120" height="74" rx="20"/>
    <rect x="540" y="648" width="120" height="74" rx="20"/><rect x="720" y="648" width="120" height="74" rx="20"/>
    <rect x="900" y="648" width="120" height="74" rx="20"/><rect x="1080" y="648" width="120" height="74" rx="20"/>
  </g>
  <text x="118" y="702" fill="#9fc3e0" font-size="26" font-weight="600" transform="rotate(-90 118 702)" text-anchor="end">chest wall</text>
  <!-- pectoralis muscle -->
  <path d="M140 560 Q672 505 1204 560 L1204 640 Q672 610 140 640 Z" fill="#a34e4e"/>
  <text x="1215" y="608" fill="#e0a8a8" font-size="26" font-weight="600">pectoralis muscle</text>
  <!-- breast mound: skin outline -->
  <path d="M140 560 Q200 250 560 165 Q900 105 1204 235 L1204 560 Q672 505 140 560 Z"
        fill="#f2d3bd" stroke="#f7e6d4" stroke-width="6"/>
  <!-- fat layer (subcutaneous, lighter) -->
  <path d="M165 540 Q225 275 565 195 Q890 140 1184 260 L1184 320 Q890 205 585 255 Q280 330 210 545 Z" fill="#f6e3cf" opacity="0.75"/>
  <!-- glandular tissue (lobulated) -->
  <g fill="url(#gland)" opacity="0.9">
    <ellipse cx="450" cy="430" rx="120" ry="80"/><ellipse cx="620" cy="380" rx="135" ry="90"/>
    <ellipse cx="800" cy="360" rx="130" ry="85"/><ellipse cx="960" cy="390" rx="115" ry="78"/>
    <ellipse cx="530" cy="510" rx="110" ry="62"/><ellipse cx="720" cy="490" rx="125" ry="66"/>
    <ellipse cx="905" cy="495" rx="110" ry="60"/>
  </g>
  <!-- lump: distinct, slightly irregular, highlighted -->
  <ellipse cx="700" cy="415" rx="62" ry="48" fill="#7c3b52" stroke="#ffd35e" stroke-width="7"/>
  <circle cx="700" cy="415" r="92" fill="none" stroke="#ffd35e" stroke-width="3" stroke-dasharray="4 10" opacity="0.85"/>
  <line x1="762" y1="415" x2="905" y2="290" stroke="#ffd35e" stroke-width="3"/>
  <circle cx="762" cy="415" r="6" fill="#ffd35e"/>
  <text x="915" y="285" fill="#ffd35e" font-size="34" font-weight="700">the lump</text>
  <text x="915" y="322" fill="#cdbfa0" font-size="24">it sits inside the breast tissue</text>
  <!-- nipple at mound apex (anatomical, non-sexualised side profile) -->
  <path d="M1198 232 q34 6 30 30 q-4 20 -34 16" fill="#e4b79c"/>
  <!-- skin label -->
  <text x="252" y="242" fill="#5d4636" font-size="26" font-weight="600" transform="rotate(-24 252 242)">skin</text>
  <!-- caption strip -->
  <text x="672" y="750" fill="#7fa8c8" font-size="24" text-anchor="middle">side-view diagram — the lump is inside the breast tissue, above the muscle</text>
</svg>
